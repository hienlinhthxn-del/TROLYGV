<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EduAssist AI">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <title>EduAssist AI - Trợ lý Giáo viên 4.0</title>

    <!-- Libraries -->
    <!-- Tailwind utilities are required by the React UI.
         Keep CDN fallback enabled so the app remains usable even when bundled CSS is missing. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            height: 100dvh;
            min-height: -webkit-fill-available;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .typing-cursor::after {
            content: '●';
            display: inline-block;
            margin-left: 4px;
            color: #4f46e5;
            font-size: 8px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        .message-appear {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <script>
        // Diagnostic check
        console.log("%c EduAssist AI Turbo Diagnostic ", "background: #4f46e5; color: white; font-weight: bold; padding: 4px; border-radius: 4px;");
    </script>

    <!-- Script nhận diện Link chia sẻ đề thi (?exam=... hoặc #exam=...) -->
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const hasSearchExam = urlParams.has('exam') || urlParams.has('s');
            const hasHashExam = window.location.hash && window.location.hash.includes('exam=');
            if (hasSearchExam || hasHashExam) {
                window.ai_status = "Đang mở đề thi từ Link chia sẻ...";
            }
        })();
    </script>
</head>

<body class="bg-slate-50 text-slate-900 overflow-hidden">
    <div id="root"></div>
    <!-- Thêm thư viện hỗ trợ xuất bản và đọc PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
